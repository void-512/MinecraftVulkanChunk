plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter {
            includeGroup 'org.lwjgl'
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    lwjglBundle
    implementation.extendsFrom lwjglBundle
    // ModDevGradle launches from classes instead of the shaded production JAR.
    additionalRuntimeClasspath.extendsFrom lwjglBundle
}

dependencies {
    lwjglBundle "org.lwjgl:lwjgl:${lwjgl_version}"
    lwjglBundle "org.lwjgl:lwjgl-vulkan:${lwjgl_version}"
    lwjglBundle "org.lwjgl:lwjgl:${lwjgl_version}:natives-linux-arm64"
    lwjglBundle "org.lwjgl:lwjgl:${lwjgl_version}:natives-windows"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.lwjglBundle.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF', 'module-info.class'
    manifest {
        attributes 'Automatic-Module-Name': 'dev.vulkanchunk'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
