modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="vulkanchunk contributors"
description='''
Vulkan acceleration for supported Minecraft overworld noise-density chunk generation.
Unsupported or failed Vulkan operation uses vanilla CPU generation with a warning.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version}]"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

[[mixins]]
config="vulkanchunk.mixins.json"
